[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telugu-speech"
version = "0.2.0"
description = "Self-hosted low-memory Telugu speech-to-text and text-to-speech API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Telugu AI Speech Lab" }]
keywords = ["telugu", "speech-to-text", "text-to-speech", "asr", "tts"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.6,<3",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0,<2"]
host = [
  "faster-whisper>=1.0,<2",
  "onnxruntime>=1.17,<2",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]
# Benchmark harness: pytest for the harness tests, jiwer to cross-check WER
# against the repo's own implementation (see telugu_speech/bench.py
# --crosscheck-jiwer). Neither is needed to run the server.
bench = ["pytest>=8,<9", "jiwer>=3,<4"]
# Deliberately NOT declared (keeps the default install light; see
# docs/LIGHTWEIGHT.md): torch + transformers are imported lazily only by
# the legacy MMS / IndicF5 / IndicConformer paths and the one-off
# scripts/compress_models.py + scripts/fetch_mms_tts.py; datasets +
# huggingface_hub + soundfile are one-off fetch/bench scripts only
# (scripts/fetch_fleurs_sample.py, scripts/fetch_models.py,
# scripts/fetch_lite_voice.py). They are manual, per-need installs —
# never add torch to [host]: it would add ~1-2 GB to the image.

[project.scripts]
telugu-bench = "telugu_speech.cli:main"
telugu-api = "telugu_speech.api.main:main"
bhasha-api = "bhasha_platform.api:main"
bhasha-catalog = "bhasha_platform.catalog:main"

[tool.setuptools.packages.find]
where = ["src", "platform/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "platform/src"]
addopts = "-q"
